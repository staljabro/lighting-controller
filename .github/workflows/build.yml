name: Windows build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore LightingController.slnx --configfile NuGet.Config
      - run: dotnet test LightingController.slnx --no-restore --configuration Release
